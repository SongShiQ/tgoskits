args = [
    "-nographic",
    "-m", "512M",
    "-cpu", "cortex-a53",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0",
    "-netdev", "user,id=net0",
    "-append", "root=/dev/sda",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:"
shell_init_cmd = "/usr/bin/cgroup-test.sh"
success_regex = ["CGROUP_TEST_DONE RC=0"]
fail_regex = [
    "(?i)not found",
    "(?i)segmentation fault",
    "(?i)kernel panic",
    "(?i)panicked at",
]
timeout = 60
